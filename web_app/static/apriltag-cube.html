<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>AprilTag Cube Generator</title>
<!-- FAVICON (generated by web_app/tools/build_favicons.py) -->

<link rel="apple-touch-icon" href="icons/apriltag-cube-180.png">

<style>
	html, body { height: 100%; margin: 0; }
	body { font-family: "Segoe UI", sans-serif; background: #1a1d21; color: #e8e8e8; display: flex; flex-direction: column; }
	header { padding: 12px 20px; border-bottom: 1px solid #3a3f45; }
	header a { color: #8fb4e8; text-decoration: none; }
	h1 { font-size: 18px; margin: 8px 0 0 0; font-weight: 600; }
	.header-note { margin: 4px 0 0; font-size: 13px; color: #a0a5ab; }
	main { flex: 1; display: flex; min-height: 0; }
	.controls { width: 300px; padding: 16px 20px; border-right: 1px solid #3a3f45; overflow-y: auto; box-sizing: border-box; position: relative; }
	.controls label { display: block; margin-top: 12px; font-size: 13px; color: #c0c4c9; }
	.controls select { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px; background: #2a2e33; border: 1px solid #3a3f45; color: #e8e8e8; border-radius: 4px; }
	.controls input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px; background: #2a2e33; border: 1px solid #3a3f45; color: #e8e8e8; border-radius: 4px; }
	.controls button { margin-top: 16px; width: 100%; padding: 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
	#generate-btn { background: #5a8cd2; color: white; }
	#generate-btn:hover { background: #4a7cc2; }
	#download-btn { background: #3a3f45; color: #e8e8e8; margin-top: 8px; }
	#download-step-btn { background: #3a3f45; color: #e8e8e8; margin-top: 8px; }
	#download-btn:hover:not(:disabled) { background: #4a4f55; }
	#download-step-btn:hover:not(:disabled) { background: #4a4f55; }
	#download-btn:disabled { opacity: 0.5; cursor: not-allowed; }
	#download-step-btn:disabled { opacity: 0.5; cursor: not-allowed; }
	.fixed-info { margin-top: 14px; font-size: 11px; color: #6a6f75; line-height: 1.6; }
	.hint { margin-top: 4px; font-size: 11px; color: #6a6f75; }
	.controls .radio, .controls .check { display: flex; align-items: center; gap: 8px; }
	.controls .radio { margin-top: 10px; color: #c0c4c9; }
	.controls .check { margin-top: 16px; font-size: 13px; color: #e8e8e8; }
	.controls .check.sub { margin-top: 8px; }
	.controls .pair { display: flex; gap: 10px; }
	.controls .pair > div { flex: 1; min-width: 0; }
	.controls .radio input, .controls .check input { width: auto; margin: 0; }
	/* Help: a "?" after a label; its text pops up across the sidebar on hover, or on tap (focus). */
	.controls button.tip { flex: none; width: 16px; height: 16px; margin: 0 0 0 4px; padding: 0; border-radius: 50%; border: 1px solid #5a5f65; background: transparent; color: #a0a5ab; font-size: 10px; line-height: 14px; font-weight: 600; cursor: help; vertical-align: 1px; }
	.controls button.tip:hover, .controls button.tip:focus { border-color: #8fb4e8; color: #8fb4e8; outline: none; }
	.tip-text { display: none; position: absolute; left: 12px; right: 12px; margin-top: 20px; z-index: 10; padding: 8px 10px; background: #2f343a; border: 1px solid #4a4f55; border-radius: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); color: #d8dbde; font-size: 12px; font-weight: normal; line-height: 1.5; text-align: left; cursor: default; }
	.tip:hover .tip-text, .tip:focus .tip-text { display: block; }
	.tip.up .tip-text { margin-top: 0; transform: translateY(calc(-100% - 6px)); }  /* near the bottom: open upwards */
	.controls input:disabled { opacity: 0.45; }
	#status { margin-top: 14px; font-size: 12px; color: #a0a5ab; white-space: pre-wrap; }
	#status.error { color: #e08a8a; }
	.viewer { flex: 1; position: relative; }
	#viewer-canvas { display: block; width: 100%; height: 100%; }
	.viewer-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6a6f75; font-size: 14px; pointer-events: none; }
	@media (max-width: 700px) {
		main { flex-direction: column; }
		.controls { width: 100%; max-height: 50vh; border-right: none; border-bottom: 1px solid #3a3f45; }
		.viewer { min-height: 50vh; }
	}
</style>
</head>
<body>
	<header>
		<a href="index.html">&larr; CAD Generators</a>
		<h1>AprilTag Cube Generator</h1>
		<p class="header-note">Detect the printed tags with your phone's camera: <a href="https://vgroenhuis.github.io/AprilTagDetector/" target="_blank" rel="noopener">AprilTag Detector</a> (tag16h5, with pose and distance).</p>
	</header>
	<main>
		<div class="controls">
			<label>Tags (tag16h5, IDs 0-29)</label>
			<label class="radio" for="mode_same"><input type="radio" name="tag_mode" id="mode_same" value="same"> Same tag on all faces <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">One ID, or several comma-separated IDs: one cube per ID, in the smallest square grid (2x2, 3x3, ...) with 2 mm spacing.</span></button></label>
			<input type="text" id="tag_id" autocomplete="off" placeholder="0  or  0,1,2,3">
			<label class="check sub" for="rotate_sides"><input type="checkbox" id="rotate_sides"> Turn the side tags a quarter turn each <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">The tag's top edge points up on +X, left on +Y, down on -X and right on -Y (seen from outside). The detector reports which way a tag is turned, so for an upright cube it can tell which side it sees, and the cube's heading, with just one ID per cube.</span></button></label>
			<label class="radio" for="mode_faces"><input type="radio" name="tag_mode" id="mode_faces" value="faces"> <span id="faces-title">Five different tags</span> <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip" id="faces-tip"></span></button></label>
			<input type="text" id="tag_ids" autocomplete="off" placeholder="0,1,2,3,4">
			<div class="hint" id="faces-hint">Order: +X, +Y, -X, -Y, top</div>
			<label class="radio" for="mode_world"><input type="radio" name="tag_mode" id="mode_world" value="world"> World frame cube <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">Tag 29 on all five faces, the side tags turned so the cube&#39;s heading can be read, labelled "World frame", with the red/green axes on the floor.</span></button></label>

			<label class="check" for="bottom_label"><input type="checkbox" id="bottom_label"> Bottom face: label with the ID(s) <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip" id="label-hint">A cube standing on a surface never shows its bottom face to the camera. Leave empty for the default label (shown greyed out): the ID, or with different tags each side&#39;s ID along its edge and the top ID in the centre. Long labels are split over two lines; | forces a line break. Untick to put a tag on the bottom face as well.</span></button></label>
			<input type="text" id="label" autocomplete="off" maxlength="40">

			<label for="size">Cube size (mm)</label>
			<input type="text" inputmode="decimal" autocomplete="off" id="size">

			<label for="tag_size">Tag size (mm, black square) <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">The tag (6 cells wide) sits inside a 1-cell white margin, so tag size = 0.75 x cube size. Changing one changes the other.</span></button></label>
			<input type="text" inputmode="decimal" autocomplete="off" id="tag_size">

			<label for="depth">Black depth (mm) <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">How deep the black tag cells and the bottom label are inlaid into the white cube, flush with its faces.</span></button></label>
			<input type="text" inputmode="decimal" autocomplete="off" id="depth">

			<label class="check" for="edge_colours"><input type="checkbox" id="edge_colours"> Red/green bottom edges (X/Y) <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">A red strip along the bottom edge of the +X face and a green one along the +Y face, inlaid flush in the white margin below the tag, so the cube keeps its size. Their ends are cut at 45 degrees, so each colour shows on its own face only.</span></button></label>
			<div class="pair">
				<div><label for="edge_height">Height (mm) <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">Height of the red/green strips, 1 mm by default. At most the white margin below the tag, 1/8 of the cube size.</span></button></label>
				<input type="text" inputmode="decimal" autocomplete="off" id="edge_height"></div>
				<div><label for="edge_depth">Depth (mm) <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">How deep the red/green strips are inlaid, 1 mm by default. Less than the white margin, 1/8 of the cube size. Where a deep edge meets the bottom label, the label gives way.</span></button></label>
				<input type="text" inputmode="decimal" autocomplete="off" id="edge_depth"></div>
			</div>

			<label class="check" for="axes"><input type="checkbox" id="axes"> Red/green axes (X/Y) on the floor <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">Flat red (+X) and green (+Y) arrows on the floor beside the cube, on its X and Y axes, to show the world frame. They stick out beside the cube.</span></button></label>

			<button id="generate-btn">Generate</button>
			<label for="printer">3MF for Bambu Studio <button type="button" class="tip" aria-label="Help">?<span class="tip-text" role="tooltip">Every 3MF puts each colour on its own filament slot in Bambu Studio and OrcaSlicer (white 1, black 2, red 3, green 4). With your Bambu Lab printer chosen, the 3MF is also a Bambu Studio project for it: open it as a project and the filament colours come along, with the printer's standard presets (0.20mm Standard, Bambu PLA Basic) and the cube in the middle of the plate. Other slicers read either kind.</span></button></label>
			<select id="printer"><option value="">Any slicer (slots only, no colours)</option></select>
			<button id="download-btn" disabled>Download 3MF (for slicing)</button>
			<button id="download-step-btn" disabled>Download STEP (for CAD)</button>

			<div class="fixed-info">One body per colour in the files <button type="button" class="tip up" aria-label="Help">?<span class="tip-text" role="tooltip">The 3MF and STEP files contain one body per colour, for multimaterial printing: "white" (cube with pockets) and "black" (tag cells and bottom label or tag, inlaid flush), plus "red" (+X) and "green" (+Y) with the red/green edges and/or the axes arrows, so two or four bodies.</span></button></div>

			<div id="status">Enter dimensions and click Generate.</div>
		</div>
		<div class="viewer">
			<div class="viewer-placeholder" id="viewer-placeholder">No model generated yet.</div>
			<canvas id="viewer-canvas"></canvas>
		</div>
	</main>

	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
		}
	}
	</script>
	<script type="module" src="apriltag-cube.js"></script>
</body>
</html>
