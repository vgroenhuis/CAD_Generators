[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "build123d-sandbox"
version = "0.1.0"
description = "Ring, pneumatic cylinder, and powerbank holder CAD generator apps using build123d and Tkinter"
readme = "README.md"
authors = [
    {name = "Vince", email = "groenhuis@gmail.com"},
]
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "build123d>=0.6.0",
    "ttkbootstrap>=1.6.0",
    "pillow>=10.0.0",
    "ocp-vscode>=2.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[project.scripts]
ring-app = "ring_app.ring_ui:main"
cylinder-app = "pneumatic_cylinder_app.cylinder_ui:main"
powerbank-holder-app = "powerbank_holder_app.powerbank_holder_ui:main"
sandbox-app = "sandbox.sandbox_app:main"
ring-web = "web_app.server:main"

[tool.setuptools.packages.find]
include = ["ring_app*", "pneumatic_cylinder_app*", "powerbank_holder_app*", "sandbox*", "web_app*"]
